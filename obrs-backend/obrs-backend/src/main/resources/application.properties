# =====================================================================
#  OBRS Backend - base configuration
#  Every secret is read from an environment variable. Never commit real values.
# =====================================================================
spring.application.name=obrs-backend
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
# Trust X-Forwarded-* only when running behind your own reverse proxy / load balancer
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---------------- Database (PostgreSQL by default) -------------------
# For MySQL, run with --spring.profiles.active=mysql (see application-mysql.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obrs}
spring.datasource.username=${DB_USERNAME:obrs}
spring.datasource.password=${DB_PASSWORD:obrs_dev_password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ---------------- JPA / Hibernate ------------------------------------
# Flyway owns the schema; Hibernate never alters tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
# Batch-load lazy associations/collections to avoid N+1 selects
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Fail a pessimistic lock wait after 5 s instead of hanging (ms)
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# ---------------- Flyway --------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

# ---------------- JWT -----------------------------------------------
# Base64-encoded secret, at least 32 bytes. Generate: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:obrs-api}
app.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}

# ---------------- Security ------------------------------------------
app.security.max-failed-logins=5
app.security.lockout-duration=15m
app.security.auth-rate-limit-per-minute=10
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------- Booking rules -------------------------------------
app.booking.seat-lock-duration=10m
app.booking.max-seats-per-booking=6
app.booking.tax-rate=0.05
app.booking.lock-cleanup-interval-ms=60000
app.booking.zone-id=Asia/Kolkata

# ---------------- Seed data (dev profile only) ----------------------
app.seed.enabled=false
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@obrs.local}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

# ---------------- Actuator / API docs -------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

logging.level.root=INFO
logging.level.com.obrs=INFO
